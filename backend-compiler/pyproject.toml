[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backend-compiler"
version = "0.1.0"
description = "Deterministic ontology-driven compiler from natural-language backend requirements to deployable Supabase projects"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["compiler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]