[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backend-compiler"
version = "0.1.0"
description = "Deterministic ontology-driven compiler from natural-language backend requirements to deployable Supabase projects"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "numpy>=1.26",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6",
]

[tool.setuptools.packages.find]
include = ["compiler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: integration tests requiring the postgres:15 test container or long runtime",
]

[tool.ruff.lint]
# ruff's documented default set (pyflakes + pycodestyle E4/E7/E9) plus
# isort, which the codebase already follows.
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
# The real laya client imports the weight-bearing `laya` package lazily;
# tests exercise MockLayaClient instead, and the import stays optional.
[[tool.mypy.overrides]]
module = "laya.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["compiler"]
omit = ["compiler/api/*"]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]