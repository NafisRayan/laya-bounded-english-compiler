[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backend-compiler"
version = "0.1.0"
description = "Deterministic ontology-driven compiler from natural-language backend requirements to deployable Supabase projects"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["compiler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: integration tests requiring the postgres:15 test container or long runtime",
]