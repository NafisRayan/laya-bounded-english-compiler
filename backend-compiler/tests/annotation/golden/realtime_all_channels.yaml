# Annotation worksheet — realtime_all_channels (golden set)
# Protocol: docs/annotation-protocol.md. Fill ONLY from the input text.
# Omit a feature if the input is silent on it; do not guess.
case: realtime_all_channels
input: 'Everything should update live: new messages, booking changes, and notifications.'
features:
  authentication: true
  bookings: true
  messaging: true
  realtime: true
parameters:
  realtime.channels: [messages, bookings, notifications]
roles: []
buckets: []
edge_functions: [notification_dispatch]
notes: "All three channels are enumerated explicitly. messaging and bookings are then forced by the ontology rules that a messages channel requires messaging and a bookings channel requires bookings, rather than being asked for in their own right. No actor class named."
