# Annotation worksheet — negation_resolved_by_answer (golden set)
# Protocol: docs/annotation-protocol.md. Fill ONLY from the input text.
# Omit a feature if the input is silent on it; do not guess.
case: negation_resolved_by_answer
input: 'Buyers can pay for services. There are no payments.'
features:
  payments: false
parameters: {}
roles: []
buckets: []
edge_functions: []
notes: "A direct self-contradiction. Reading one: buyers pay, so payments is on. Reading two: there are no payments, so it is off. Per protocol I take the more conservative reading and disable payments, which also means no authentication closure and no stripe_webhook. Buyers pay for services but never book or own a listing, so neither renter nor owner applies and roles stays empty. This case needs a human decision."
