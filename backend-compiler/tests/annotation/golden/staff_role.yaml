# Annotation worksheet — staff_role (golden set)
# Protocol: docs/annotation-protocol.md. Fill ONLY from the input text.
# Omit a feature if the input is silent on it; do not guess.
case: staff_role
input: 'Staff can manage the platform.'
features:
  authentication: true
  roles: true
parameters:
  roles.role_names: [staff]
roles: [admin]
buckets: []
edge_functions: []
notes: "Staff is a named, assigned role, so the roles feature is on and role_names keeps the input word. The ontology has no staff role, so the roles list maps it to admin, the platform-wide role. Same mapping I used for moderator elsewhere."
