# Annotation worksheet — realtime_booking_updates (held_out set)
# Protocol: docs/annotation-protocol.md. Fill ONLY from the input text.
# Omit a feature if the input is silent on it; do not guess.
case: realtime_booking_updates
input: 'Renters book items and get live updates the moment their booking status changes.'
features:
  authentication: true
  bookings: true
  realtime: true
parameters:
  realtime.channels: [bookings]
roles: [renter]
buckets: []
edge_functions: [notification_dispatch]
notes: "Live updates on booking status is realtime scoped to the bookings channel only; messages and notifications are never mentioned. notification_dispatch is listed because realtime activates it in the ontology. Booking mode is unpinned."
