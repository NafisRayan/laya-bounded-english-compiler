# Annotation worksheet — charge_word_payments (held_out set)
# Protocol: docs/annotation-protocol.md. Fill ONLY from the input text.
# Omit a feature if the input is silent on it; do not guess.
case: charge_word_payments
input: 'We charge renters for each booking.'
features:
  authentication: true
  bookings: true
  payments: true
parameters: {}
roles: [renter]
buckets: []
edge_functions: [stripe_webhook]
notes: "Charging money is payments; each booking names bookings directly. No provider is named, so payments.provider is left unset even though stripe is the only option in the ontology. bookings.mode is not pinned. stripe_webhook is listed because payments activates it in the ontology."
