version: 1
entities:
  users:
    managed_by: supabase_auth
    fields:
      id:
        type: uuid
        pk: true
      email:
        type: text
        unique: true
      created_at:
        type: timestamptz
        default: now()
  profiles:
    fields:
      id:
        type: uuid
        pk: true
        fk: users.id
        on_delete: cascade
      display_name:
        type: text
      avatar_url:
        type: text
        nullable: true
      bio:
        type: text
        nullable: true
      role:
        type: text
        default: '''user'''
      created_at:
        type: timestamptz
        default: now()
    auto_create_on: users.insert
  listings:
    fields:
      id:
        type: uuid
        pk: true
        default: gen_random_uuid()
      owner_id:
        type: uuid
        fk: users.id
        on_delete: cascade
      title:
        type: text
      description:
        type: text
      category:
        type: text
      price_cents:
        type: integer
      status:
        type: text
        default: '''draft'''
      created_at:
        type: timestamptz
        default: now()
      updated_at:
        type: timestamptz
        default: now()
    indexes:
    - columns:
      - owner_id
    - columns:
      - category
      - status
  bookings:
    fields:
      id:
        type: uuid
        pk: true
        default: gen_random_uuid()
      listing_id:
        type: uuid
        fk: listings.id
        on_delete: cascade
      renter_id:
        type: uuid
        fk: users.id
        on_delete: cascade
      owner_id:
        type: uuid
        fk: users.id
        on_delete: cascade
      start_at:
        type: timestamptz
      end_at:
        type: timestamptz
      status:
        type: text
        default: '''pending'''
      created_at:
        type: timestamptz
        default: now()
    indexes:
    - columns:
      - listing_id
      - start_at
      - end_at
    - columns:
      - renter_id
    - columns:
      - owner_id
  messages:
    fields:
      id:
        type: uuid
        pk: true
        default: gen_random_uuid()
      sender_id:
        type: uuid
        fk: users.id
        on_delete: cascade
      recipient_id:
        type: uuid
        fk: users.id
        on_delete: cascade
      booking_id:
        type: uuid
        fk: bookings.id
        nullable: true
        on_delete: set null
      body:
        type: text
      created_at:
        type: timestamptz
        default: now()
    indexes:
    - columns:
      - sender_id
      - recipient_id
    - columns:
      - booking_id
  payments:
    fields:
      id:
        type: uuid
        pk: true
        default: gen_random_uuid()
      booking_id:
        type: uuid
        fk: bookings.id
        nullable: true
        on_delete: set null
      payer_id:
        type: uuid
        fk: users.id
        on_delete: cascade
      amount_cents:
        type: integer
      currency:
        type: text
        default: '''usd'''
      provider:
        type: text
        default: '''stripe'''
      provider_ref:
        type: text
      status:
        type: text
        default: '''pending'''
      created_at:
        type: timestamptz
        default: now()
  reviews:
    fields:
      id:
        type: uuid
        pk: true
        default: gen_random_uuid()
      booking_id:
        type: uuid
        fk: bookings.id
        on_delete: cascade
      author_id:
        type: uuid
        fk: users.id
        on_delete: cascade
      subject_id:
        type: uuid
        fk: users.id
        on_delete: cascade
      rating:
        type: integer
      body:
        type: text
      created_at:
        type: timestamptz
        default: now()
  files:
    fields:
      id:
        type: uuid
        pk: true
        default: gen_random_uuid()
      owner_id:
        type: uuid
        fk: users.id
        on_delete: cascade
      bucket:
        type: text
      path:
        type: text
      mime_type:
        type: text
      size_bytes:
        type: integer
      created_at:
        type: timestamptz
        default: now()
  verification_documents:
    fields:
      id:
        type: uuid
        pk: true
        default: gen_random_uuid()
      user_id:
        type: uuid
        fk: users.id
        on_delete: cascade
      document_type:
        type: text
      storage_path:
        type: text
      status:
        type: text
        default: '''pending'''
      reviewed_by:
        type: uuid
        fk: users.id
        nullable: true
      reviewed_at:
        type: timestamptz
        nullable: true
      created_at:
        type: timestamptz
        default: now()
  favorites:
    fields:
      user_id:
        type: uuid
        fk: users.id
        on_delete: cascade
        pk: true
      listing_id:
        type: uuid
        fk: listings.id
        on_delete: cascade
        pk: true
      created_at:
        type: timestamptz
        default: now()
  notifications:
    fields:
      id:
        type: uuid
        pk: true
        default: gen_random_uuid()
      user_id:
        type: uuid
        fk: users.id
        on_delete: cascade
      kind:
        type: text
      payload:
        type: jsonb
      read_at:
        type: timestamptz
        nullable: true
      created_at:
        type: timestamptz
        default: now()
    indexes:
    - columns:
      - user_id
      - read_at
features:
  authentication:
    requires: []
    activates_entities:
    - profiles
    activates_edge_functions: []
    parameters:
      method:
        type: choice
        options:
        - email_password
        - magic_link
        - oauth_google
        - oauth_github
  roles:
    requires:
    - authentication
    activates_entities: []
    activates_edge_functions: []
    parameters:
      role_names:
        type: list[string]
        min: 1
        max: 5
  bookings:
    requires:
    - authentication
    activates_entities:
    - listings
    - bookings
    activates_edge_functions: []
    parameters:
      mode:
        type: choice
        options:
        - instant
        - owner_approval
        - request_then_approval
        - time_slot
  messaging:
    requires:
    - authentication
    activates_entities:
    - messages
    activates_edge_functions: []
    parameters:
      trigger_event:
        type: choice
        options:
        - before_booking
        - after_request
        - after_approval
        - anytime
  payments:
    requires:
    - authentication
    activates_entities:
    - payments
    activates_edge_functions:
    - stripe_webhook
    parameters:
      provider:
        type: choice
        options:
        - stripe
  reviews:
    requires:
    - bookings
    activates_entities:
    - reviews
    activates_edge_functions: []
  file_storage:
    requires:
    - authentication
    activates_entities:
    - files
    activates_edge_functions: []
    parameters:
      bucket_purpose:
        type: choice
        options:
        - avatars
        - listings
        - documents
        - mixed
  verification:
    requires:
    - authentication
    - file_storage
    activates_entities:
    - verification_documents
    activates_edge_functions:
    - verification_webhook
    parameters:
      method:
        type: choice
        options:
        - email
        - phone
        - government_id
        - admin_approval
        - government_id_and_admin
  realtime:
    requires:
    - authentication
    activates_entities:
    - notifications
    activates_edge_functions:
    - notification_dispatch
    parameters:
      channels:
        type: list[choice]
        options:
        - messages
        - notifications
        - bookings
  favorites:
    requires:
    - authentication
    - bookings
    activates_entities:
    - favorites
    activates_edge_functions: []
roles:
  guest:
    authenticated: false
  user:
    authenticated: true
  owner:
    authenticated: true
    derived_from: user
    condition: exists(listings where owner_id = auth.uid())
  renter:
    authenticated: true
    derived_from: user
  admin:
    authenticated: true
    assigned_by: profiles.role = 'admin'
  verifier:
    authenticated: true
    assigned_by: profiles.role = 'verifier'
rls_patterns:
  public_read:
    sql: 'true'
  authenticated_read:
    sql: auth.uid() IS NOT NULL
  owner_only:
    sql: auth.uid() = owner_id
  owner_or_admin:
    sql: auth.uid() = owner_id OR is_admin()
  participant_only:
    sql: auth.uid() IN (renter_id, owner_id)
  sender_or_recipient:
    sql: auth.uid() IN (sender_id, recipient_id)
  role_restricted:
    sql: EXISTS (SELECT 1 FROM profiles WHERE id = auth.uid() AND role = '{role}')
constraints:
- type: requires
  if:
    feature: payments
    value: true
  then:
    feature: authentication
    value: true
  message: Payments requires authentication.
- type: requires
  if:
    feature: reviews
    value: true
  then:
    feature: bookings
    value: true
  message: Reviews require bookings.
- type: requires
  if:
    feature: verification
    value: true
  then:
    feature: file_storage
    value: true
  message: Verification requires file storage for documents.
- type: requires
  if:
    feature: favorites
    value: true
  then:
    feature: bookings
    value: true
  message: Favorites requires listings (via bookings).
- type: requires
  if:
    feature: realtime
    parameter: channels
    contains: messages
  then:
    feature: messaging
    value: true
  message: Realtime messaging requires the messaging feature.
- type: requires
  if:
    feature: realtime
    parameter: channels
    contains: bookings
  then:
    feature: bookings
    value: true
  message: Realtime booking updates require the bookings feature.
- type: contradicts
  if:
    feature: bookings
    parameter: mode
    value: instant
  then:
    feature: verification
    value: true
  reason: Instant booking is incompatible with owner verification.
  severity: hard
- type: weakens
  if:
    feature: messaging
    parameter: trigger_event
    value: anytime
  then:
    feature: authentication
    value: true
  reason: Anytime messaging requires authenticated identities.
  severity: soft
